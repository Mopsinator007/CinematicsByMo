<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Files — CinematicByMo.com</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

.files-app {
  --bg-0: #0B0A09;
  --bg-1: #141210;
  --bg-2: #1C1916;
  --bg-3: #242019;
  --border: #2A2621;
  --border-strong: #3B342C;
  --text-primary: #EDE8DF;
  --text-secondary: #A39C8F;
  --text-tertiary: #6E675C;
  --rec: #D9483B;
  --amber: #D99A3B;
  --green: #4F9E6B;
  --cyan: #4C8FBF;
  --muted: #6E675C;
  --font-display: 'Oswald', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;

  display: flex;
  width: 100%;
  min-height: 100vh;
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 13.5px;
  -webkit-font-smoothing: antialiased;
}
.files-app * { box-sizing: border-box; }
.files-app ::selection { background: var(--rec); color: #fff; }
.files-app button { font-family: inherit; cursor: pointer; }
.files-app input, .files-app select, .files-app textarea { font-family: inherit; }
.files-app .mono { font-family: var(--font-mono); letter-spacing: 0.01em; }

.files-loading { align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--text-secondary); width: 100%; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

svg.icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; flex: 0 0 auto; }

/* ---- sidebar ---- */
.sidebar {
  width: 232px; flex: 0 0 232px; background: var(--bg-1); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 14px; position: sticky; top: 0; height: 100vh;
}
.sidebar-brand { padding: 4px 8px 20px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.sidebar-brand-top { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 4px; }
.sidebar-brand-bottom { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: center; gap: 7px; margin: 0; }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.sidebar-sep { height: 1px; background: var(--border); margin: 8px 6px; }
.sidebar-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; border: none;
  background: transparent; color: var(--text-secondary); font-size: 13px; text-align: left; width: 100%;
  transition: background 0.12s, color 0.12s;
}
.sidebar-item:hover { background: var(--bg-2); color: var(--text-primary); }
.sidebar-item.is-active { background: var(--bg-3); color: var(--text-primary); }
.sidebar-foot { position: relative; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.settings-drop { position: absolute; bottom: 44px; left: 0; right: 0; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 8px; padding: 4px; z-index: 40; }
.settings-drop button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; background: none; border: none; color: var(--text-secondary); font-size: 12.5px; border-radius: 5px; }
.settings-drop button:hover { background: var(--bg-3); color: var(--text-primary); }

/* ---- main column / topbar ---- */
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 28px; border-bottom: 1px solid var(--border); background: rgba(11,10,9,0.9); position: sticky; top: 0; z-index: 20; }
.topbar-search { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 420px; background: var(--bg-1); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; color: var(--text-tertiary); font-size: 12.5px; }
.topbar-search:hover { border-color: var(--border-strong); }
.topbar-search span { flex: 1; text-align: left; }
.topbar-search kbd { display: flex; align-items: center; gap: 2px; font-size: 10px; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 4px; padding: 2px 5px; color: var(--text-tertiary); }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.bell-btn { position: relative; background: none; border: 1px solid var(--border); border-radius: 7px; padding: 7px; color: var(--text-secondary); display: flex; }
.bell-btn:hover { background: var(--bg-1); color: var(--text-primary); }
.bell-badge { position: absolute; top: -5px; right: -5px; background: var(--rec); color: #fff; font-size: 9px; font-weight: 600; padding: 1px 4px; border-radius: 8px; min-width: 15px; text-align: center; }

.main-scroll { flex: 1; overflow-y: auto; }
.view-pad { padding: 28px 32px 64px; max-width: 1400px; }

/* ---- brand / dashboard hero ---- */
.brand-eyebrow { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 6px; }
.dash-hero { margin-bottom: 26px; }
.dash-hero h1, .view-head h1 { font-family: var(--font-display); font-size: 34px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
.dash-tagline { color: var(--text-secondary); font-size: 13.5px; margin: 6px 0 0; }

/* ---- stat grid ---- */
.stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 32px; }
.stat-grid-compact { grid-template-columns: repeat(6, 1fr); margin-bottom: 24px; }
.stat-card {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px 14px;
  display: flex; flex-direction: column; gap: 6px; text-align: left; border-left: 2px solid var(--stat-color, var(--border));
  transition: border-color 0.12s, transform 0.12s;
}
.stat-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.stat-card-static { cursor: default; }
.stat-card-static:hover { transform: none; }
.stat-value { font-family: var(--font-display); font-size: 26px; font-weight: 600; color: var(--stat-color, var(--text-primary)); line-height: 1; }
.stat-label { font-size: 11.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 12px; }
.section-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 500; margin: 0; }
.link-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--text-secondary); font-size: 12.5px; padding: 0; }
.link-btn:hover { color: var(--text-primary); }
.link-btn-sm { background: none; border: none; color: var(--text-secondary); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; padding: 0; }
.link-btn-sm:hover { color: var(--text-primary); }
.back-btn { margin-bottom: 14px; }

/* ---- recent list ---- */
.recent-list { display: flex; flex-direction: column; gap: 1px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.recent-row { display: grid; grid-template-columns: 5px 130px 1fr 70px 110px auto auto; align-items: center; gap: 14px; padding: 11px 14px; background: var(--bg-1); border: none; border-bottom: 1px solid var(--border); text-align: left; width: 100%; }
.recent-row:last-child { border-bottom: none; }
.recent-row:hover { background: var(--bg-2); }
.recent-tally { width: 5px; height: 5px; border-radius: 50%; }
.recent-filename { font-size: 12.5px; color: var(--text-primary); }
.recent-project { font-size: 12.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-date { font-size: 11.5px; color: var(--text-tertiary); }
.recent-shot { font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-tertiary); }

/* ---- pills ---- */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; letter-spacing: 0.03em; color: var(--pill-color); white-space: nowrap; }
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pill-color); flex: 0 0 auto; }

/* ---- view head / toolbar ---- */
.view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; flex-wrap: wrap; }
.view-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.result-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-tertiary); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.result-select-actions { display: flex; gap: 12px; }

/* ---- buttons ---- */
.btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 8px 13px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text-primary); transition: background 0.12s, border-color 0.12s; }
.btn:hover { border-color: var(--border-strong); background: var(--bg-2); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-ghost { background: transparent; }
.btn-primary { background: var(--text-primary); color: var(--bg-0); border-color: var(--text-primary); font-weight: 500; }
.btn-primary:hover { background: #d8d2c6; border-color: #d8d2c6; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-danger-text { color: var(--rec); }
.btn-has-badge { position: relative; }
.count-badge { background: var(--rec); color: #fff; font-size: 9.5px; font-weight: 600; padding: 1px 5px; border-radius: 8px; margin-left: 2px; }
.icon-btn { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--text-secondary); }
.icon-btn:hover { background: var(--bg-2); color: var(--text-primary); }
.icon-btn-danger:hover { color: var(--rec); }

/* ---- popover / filters ---- */
.popover-anchor { position: relative; }
.popover { position: absolute; top: calc(100% + 8px); right: 0; z-index: 50; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
.filter-popover { width: 380px; padding: 14px; }
.popover-head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 500; margin-bottom: 10px; }
.filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filter-full { grid-column: 1 / -1; }
.filter-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-secondary); }
.filter-clear { width: 100%; margin-top: 12px; justify-content: center; }

/* ---- form controls (global) ---- */
.files-app input[type="text"], .files-app input[type="date"], .files-app input:not([type]), .files-app select, .files-app textarea {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text-primary); font-size: 12.5px; width: 100%;
}
.files-app input:focus, .files-app select:focus, .files-app textarea:focus { outline: none; border-color: var(--text-tertiary); }
.files-app textarea { resize: vertical; }

/* ---- clip grid & card ---- */
.clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
.clip-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-align: left; transition: border-color 0.12s, transform 0.12s; cursor: pointer; }
.clip-card:hover { border-color: var(--border-strong); }
.clip-card.is-selected { border-color: var(--cyan); }
.clip-card-frame { position: relative; }
.clip-select-toggle { position: absolute; top: 8px; right: 8px; background: rgba(11,10,9,0.6); border: none; border-radius: 5px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
.clip-select-toggle:hover { color: var(--text-primary); }
.clip-card-meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.clip-card-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.clip-filename { font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip-date { font-size: 10.5px; color: var(--text-tertiary); flex: 0 0 auto; }
.clip-project { font-size: 11.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip-card-row3 { display: flex; align-items: center; gap: 12px; margin-top: 2px; }

/* ---- monitor frame (signature) ---- */
.monitor { position: relative; aspect-ratio: 16/9; background: linear-gradient(180deg, #17140F 0%, #0D0B08 100%); overflow: hidden; }
.monitor-grain { position: absolute; inset: 0; background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px); pointer-events: none; }
.bracket { position: absolute; width: 14px; height: 14px; border-color: rgba(237,232,223,0.28); border-style: solid; border-width: 0; }
.bracket-tl { top: 8px; left: 8px; border-top-width: 1.5px; border-left-width: 1.5px; }
.bracket-tr { top: 8px; right: 8px; border-top-width: 1.5px; border-right-width: 1.5px; }
.bracket-bl { bottom: 8px; left: 8px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
.bracket-br { bottom: 8px; right: 8px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
.monitor-top { position: absolute; top: 8px; left: 26px; right: 26px; display: flex; align-items: center; justify-content: space-between; }
.tally { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--tally); }
.tally-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tally); box-shadow: 0 0 6px var(--tally); }
.monitor-shot { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(237,232,223,0.55); border: 1px solid rgba(237,232,223,0.25); border-radius: 3px; padding: 1px 5px; }
.monitor-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.monitor-exercise { font-family: var(--font-display); font-size: 15px; letter-spacing: 0.03em; color: rgba(237,232,223,0.82); text-transform: uppercase; }
.monitor-md .monitor-exercise { font-size: 14px; }
.monitor-lg .monitor-exercise { font-size: 20px; }
.monitor-bottom { position: absolute; bottom: 7px; left: 26px; right: 26px; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 9px; color: rgba(237,232,223,0.5); }
.monitor-lg { aspect-ratio: 16/9; border-radius: 8px; }

/* ---- add modal / detail panel shared ---- */
.modal-overlay { position: fixed; inset: 0; background: rgba(6,5,4,0.72); z-index: 100; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
.modal { background: var(--bg-1); border: 1px solid var(--border-strong); border-radius: 14px; width: 100%; max-width: 640px; margin: auto; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 22px 14px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-family: var(--font-display); font-size: 22px; font-weight: 500; margin: 2px 0 0; }
.modal-eyebrow { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); margin: 0; }
.modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 20px; max-height: 62vh; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); }

.form-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); margin: 0 0 10px; }
.form-section-title .optional { text-transform: none; letter-spacing: 0; color: var(--text-tertiary); font-size: 11px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid label, .filter-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }
.span-2 { grid-column: 1 / -1; }
.optional { color: var(--text-tertiary); font-weight: 400; font-size: 10.5px; margin-left: 4px; }
.inline-new-project { display: flex; gap: 6px; }

.tag-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-chip { font-size: 11px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-2); color: var(--text-secondary); }
.tag-chip:hover { border-color: var(--border-strong); }
.tag-chip.is-active { background: var(--bg-3); border-color: var(--text-primary); color: var(--text-primary); }

/* ---- detail panel ---- */
.detail-panel { background: var(--bg-1); border: 1px solid var(--border-strong); border-radius: 14px; width: 100%; max-width: 620px; margin: auto; }
.detail-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.detail-head-title { flex: 1; min-width: 0; }
.detail-filename-input { background: none; border: none; padding: 0; font-size: 19px; font-weight: 500; color: var(--text-primary); width: 100%; }
.detail-filename-input:focus { outline: none; }
.detail-head-actions { display: flex; gap: 4px; }
.detail-frame-wrap { padding: 18px 18px 0; }
.detail-body { padding: 18px; display: flex; flex-direction: column; gap: 18px; max-height: 52vh; overflow-y: auto; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }
.detail-status-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.status-select-label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }
.status-select { font-weight: 500; }
.detail-textarea-label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }

/* ---- bulk toolbar ---- */
.bulk-toolbar { position: sticky; bottom: 16px; margin-top: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 16px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); font-size: 12.5px; }
.bulk-actions { display: flex; align-items: center; gap: 8px; }
.bulk-actions select { width: auto; padding: 6px 8px; font-size: 12px; }

/* ---- projects ---- */
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.project-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.12s, transform 0.12s; cursor: pointer; width: 100%; }
.project-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.project-card-head { display: flex; align-items: center; justify-content: space-between; }
.project-type { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); }
.project-date { font-size: 10.5px; color: var(--text-tertiary); }
.project-card h3 { font-family: var(--font-display); font-size: 17px; font-weight: 500; margin: 0; }
.project-client { font-size: 12px; color: var(--text-secondary); margin: -4px 0 2px; }
.project-bar { height: 3px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
.project-bar-fill { height: 100%; background: var(--green); }
.project-stats-row { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--text-secondary); }
.project-stats-row .dim { color: var(--text-tertiary); }
.project-no-usage { font-size: 10.5px; color: var(--rec); }
.project-card-delete { position: absolute; top: 12px; right: 14px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px; color: var(--text-tertiary); opacity: 0; transition: opacity 0.12s, color 0.12s, border-color 0.12s; }
.project-card { position: relative; }
.project-card:hover .project-card-delete { opacity: 1; }
.project-card-delete:hover { color: var(--rec); border-color: var(--rec); }
.new-project-card { display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed var(--border-strong); background: transparent; color: var(--text-secondary); font-size: 13px; min-height: 148px; border-radius: 12px; }
.new-project-card:hover { border-color: var(--text-tertiary); color: var(--text-primary); background: var(--bg-1); }

/* ---- project detail: title / tabs / script ---- */
.project-title-input { background: none; border: none; padding: 0; width: 100%; font-family: var(--font-display); font-size: 34px; font-weight: 600; letter-spacing: 0.01em; color: var(--text-primary); }
.project-title-input:focus { outline: none; }
.project-meta-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.project-meta-row select, .project-meta-row input { width: auto; font-size: 12px; padding: 5px 8px; }
.project-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 22px 0 20px; }
.project-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 9px 4px; margin-right: 18px; font-size: 12.5px; color: var(--text-secondary); }
.project-tab:hover { color: var(--text-primary); }
.project-tab.is-active { color: var(--text-primary); border-bottom-color: var(--rec); }
.script-form { display: flex; flex-direction: column; gap: 18px; max-width: 760px; }
.script-form .form-grid { grid-template-columns: 1fr 1fr; }
.script-form label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-secondary); }
.script-form textarea.script-main { min-height: 220px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
.script-form textarea.caption-main { min-height: 90px; }

      usage: e.usage, editing: e.editing, notes: "", createdAt: Date.now() - i * 60000,
    });
  });

  var prefixes = ["A7C_0", "C000", "DJI_0", "B_0"];
  for (var i = 0; i < 58; i++) {
    var proj = pick(projects);
    counter += 1 + Math.floor(rand() * 3);
    var prefix = pick(prefixes);
    var filename = prefix + String(counter).padStart(prefix.indexOf("C000") === 0 ? 1 : 3, "0") + ".MP4";
    var exercise = pick(EXERCISES);
    var nShots = 1 + Math.floor(rand() * 2);
    var shotSet = {};
    var shotTypes = [];
    for (var s = 0; s < nShots; s++) { var st = pick(SHOT_TYPES); if (!shotSet[st]) { shotSet[st] = true; shotTypes.push(st); } }
    var editing = pick(EDITING_STATUSES);
    var usage = editing === "finished" ? pick(["used", "used", "archived", "selected"]) : pick(USAGE_STATUSES);
    clips.push({
      id: uid("clip"), filename: filename, date: proj.date, project: proj.id, client: proj.client,
      location: pick(locations), exercise: exercise,
      description: rand() > 0.5 ? (["Low-angle", "Tracking", "Static", "Handheld"][Math.floor(rand() * 4)] + " shot of " + exercise.toLowerCase() + ".") : "",
      shotTypes: shotTypes, usage: usage, editing: editing,
      notes: rand() > 0.8 ? "Could work as opening shot." : "",
      createdAt: Date.now() - (i + 8) * 60000,
    });
  }

  return { projects: projects, clips: clips };
}

/* ---- storage ---- */

function loadData() {
  var done = function (clips, projects, events) {
    state.clips = clips || []; state.projects = projects || []; state.calendarEvents = events || [];
    state.loading = false; render();
    initSync();
  };
  try {
    var local = readLocalData();
    if (local) { done(local.clips, local.projects, local.events); return; }
    var seed = buildSeed();
    persistAll(seed.clips, seed.projects, []);
    done(seed.clips, seed.projects, []);
  } catch (e) {
    state.storageError = "Browser storage is unavailable — changes may not persist.";
    var seedFallback = buildSeed();
    done(seedFallback.clips, seedFallback.projects, []);
  }
}
function readLocalData() {
  try {
    var c = localStorage.getItem("cbm-files-clips");
    var p = localStorage.getItem("cbm-files-projects");
    var ev = localStorage.getItem("cbm-files-events");
    if (!c || !p) return null;
    return { clips: JSON.parse(c), projects: JSON.parse(p), events: ev ? JSON.parse(ev) : [] };
  } catch (e) { return null; }
}
function persistClips(next) {
  state.clips = next;
  try { localStorage.setItem("cbm-files-clips", JSON.stringify(next)); } catch (e) {}
  schedulePush();
}
function persistProjects(next) {
  state.projects = next;
  try { localStorage.setItem("cbm-files-projects", JSON.stringify(next)); } catch (e) {}
  schedulePush();
}
function persistCalendarEvents(next) {
  state.calendarEvents = next;
  try { localStorage.setItem("cbm-files-events", JSON.stringify(next)); } catch (e) {}
  schedulePush();
}
function persistAll(clips, projects, events) {
  try {
    localStorage.setItem("cbm-files-clips", JSON.stringify(clips));
    localStorage.setItem("cbm-files-projects", JSON.stringify(projects));
    localStorage.setItem("cbm-files-events", JSON.stringify(events || []));
  } catch (e) {}
  schedulePush();
}

/* ---- cross-device sync (Cloudflare Worker + KV) ----
   A static page can't talk to Cloudflare KV directly (that would expose your
   API token to anyone viewing the page source), so a tiny Worker sits in
   front of the KV namespace and this app talks to that Worker over plain
   HTTP: GET /data to read, PUT /data to write. See SyncModalHtml() for the
   exact Worker code + setup steps shown to the user in the app. */

var pollTimer = null, pushTimer = null, pushInFlight = false, pushAgainAfter = false;

function loadSyncConfig() {
  try { return JSON.parse(localStorage.getItem("cbm-kv-sync-config") || "null"); } catch (e) { return null; }
}
function saveSyncConfig(cfg) {
  try { localStorage.setItem("cbm-kv-sync-config", JSON.stringify(cfg)); } catch (e) {}
}
function clearSyncConfig() {
  try { localStorage.removeItem("cbm-kv-sync-config"); } catch (e) {}
}
function workerEndpoint(cfg) {
  return cfg.workerUrl.replace(/\/+$/, "") + "/data";
}
function workerHeaders(cfg, withContentType) {
  var h = {};
  if (withContentType) h["Content-Type"] = "application/json";
  if (cfg.authKey) h["X-Auth-Key"] = cfg.authKey;
  return h;
}
function fetchRemote() {
  var cfg = loadSyncConfig();
  if (!cfg || !cfg.workerUrl) return Promise.resolve(null);
  return fetch(workerEndpoint(cfg), { headers: workerHeaders(cfg, false) }).then(function (r) {
    if (!r.ok) throw new Error("sync GET failed: " + r.status);
    return r.json();
  }).then(function (j) { return j && j.data ? j.data : null; });
}
function applyRemote(remote) {
  if (!remote) return;
  if (Array.isArray(remote.clips)) { state.clips = remote.clips; try { localStorage.setItem("cbm-files-clips", JSON.stringify(remote.clips)); } catch (e) {} }
  if (Array.isArray(remote.projects)) { state.projects = remote.projects; try { localStorage.setItem("cbm-files-projects", JSON.stringify(remote.projects)); } catch (e) {} }
  if (Array.isArray(remote.calendarEvents)) { state.calendarEvents = remote.calendarEvents; try { localStorage.setItem("cbm-files-events", JSON.stringify(remote.calendarEvents)); } catch (e) {} }
}
function pushAllNow() {
  var cfg = loadSyncConfig();
  if (!cfg || !cfg.workerUrl) return;
  if (pushInFlight) { pushAgainAfter = true; return; }
  pushInFlight = true;
  var payload = { clips: state.clips, projects: state.projects, calendarEvents: state.calendarEvents, updatedAt: Date.now() };
  fetch(workerEndpoint(cfg), { method: "PUT", headers: workerHeaders(cfg, true), body: JSON.stringify(payload) })
    .then(function (r) {
      pushInFlight = false;
      if (!r.ok) throw new Error("sync PUT failed: " + r.status);
      state.syncStatus = "synced"; render();
      if (pushAgainAfter) { pushAgainAfter = false; pushAllNow(); }
    })
    .catch(function () {
      pushInFlight = false;
      state.syncStatus = "error"; render();
    });
}
function schedulePush() {
  var cfg = loadSyncConfig();
  if (!cfg || !cfg.workerUrl) return;
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(pushAllNow, 500);
}
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function () {
    fetchRemote().then(function (remote) {
      applyRemote(remote);
      state.syncStatus = "synced"; render();
    }).catch(function () {
      state.syncStatus = "error"; render();
    });
  }, 6000);
}
function initSync() {
  var cfg = loadSyncConfig();
  if (!cfg || !cfg.workerUrl) { state.syncStatus = "local"; return; }
  state.syncStatus = "connecting"; render();
  fetchRemote().then(function (remote) {
    if (remote) { applyRemote(remote); }
    else { pushAllNow(); } // nothing in KV yet — seed it with what's on this device
    state.syncStatus = "synced"; render();
    startPolling();
  }).catch(function () {
    state.syncStatus = "error"; render();
  });
}
function handleConnectSync() {
  var url = (state.syncWorkerUrl || "").trim();
  if (!url) { showToast("Paste your Worker URL first."); return; }
  if (!/^https:\/\//.test(url)) { showToast("The Worker URL should start with https://"); return; }
  var cfg = { workerUrl: url, authKey: (state.syncAuthKey || "").trim() };
  saveSyncConfig(cfg);
  state.showSyncModal = false;
  showToast("Connecting to sync…");
  render();
  initSync();
}
function handleDisconnectSync() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
  clearSyncConfig();
  state.syncStatus = "local";
  showToast("Disconnected — this device now stores data locally only.");
  render();
}
function commitProjectDraft() {
  if (!state.projectDraft) return;
  var draft = state.projectDraft;
  persistProjects(state.projects.map(function (p) { return p.id === draft.id ? draft : p; }));
}
function handleCreateProject() {
  var f = state.newProjectForm;
  var name = f.name.trim();
  if (!name) return;
  var proj = {
    id: uid("proj"), name: name, client: f.client.trim() || "—", type: f.type, date: f.date,
    hook: "", script: "", caption: "", hashtags: "", publishDate: "",
  };
  persistProjects([proj].concat(state.projects));
  state.showNewProjectModal = false;
  showToast(proj.name + " created.");
  state.selectedProjectId = proj.id;
  state.projectDraft = projectDraftFrom(proj);
  state.projectTab = "clips";
  render();
}
function handleDeleteProject(id) {
  var p = findProject(id);
  if (!p) return;
  var count = state.clips.filter(function (c) { return c.project === id; }).length;
  var msg = "Delete \"" + p.name + "\"? This can't be undone." +
    (count > 0 ? " " + count + " file(s) in this project will be kept but unassigned." : "");
  if (!confirm(msg)) return;
  persistProjects(state.projects.filter(function (p2) { return p2.id !== id; }));
  persistClips(state.clips.map(function (c) { return c.project === id ? Object.assign({}, c, { project: "" }) : c; }));
  persistCalendarEvents(state.calendarEvents.map(function (ev) { return ev.projectId === id ? Object.assign({}, ev, { projectId: "" }) : ev; }));
  state.selectedProjectId = null;
  state.projectDraft = null;
  showToast("Project deleted.");
  render();
}
function resetToSample() {
  var seed = buildSeed();
  persistClips(seed.clips);
  persistProjects(seed.projects);
  persistCalendarEvents([]);
}
function handleSaveEvent() {
  var f = state.eventForm;
  if (!f || !f.date) { showToast("Pick a date."); return; }
  if (state.editingEventId) {
    var id = state.editingEventId;
    persistCalendarEvents(state.calendarEvents.map(function (ev) { return ev.id === id ? Object.assign({}, ev, f) : ev; }));
    showToast("Event updated.");
  } else {
    var newEv = Object.assign({ id: uid("evt"), createdAt: Date.now() }, f);
    persistCalendarEvents([newEv].concat(state.calendarEvents));
    showToast((f.type === "shoot" ? "Shoot day" : "Upload day") + " added to the calendar.");
  }
  state.showEventModal = false; state.eventForm = null; state.editingEventId = null;
  render();
}
function handleDeleteEvent(id) {
  if (!confirm("Delete this calendar event?")) return;
  persistCalendarEvents(state.calendarEvents.filter(function (ev) { return ev.id !== id; }));
  state.showEventModal = false; state.eventForm = null; state.editingEventId = null;
  showToast("Event deleted.");
  render();
}

function showToast(msg) {
  state.toast = msg;
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(function () { state.toast = ""; render(); }, 2600);
}

/* ================================ derived helpers ================================ */

function viewPredicate(view) {
  switch (view) {
    case "unedited": return function (c) { return c.editing === "unedited"; };
    case "editing": return function (c) { return c.editing === "editing"; };
    case "finished": return function (c) { return c.editing === "finished"; };
    case "no_usage": return function (c) { return c.usage === "no_usage"; };
    case "selected": return function (c) { return c.usage === "selected"; };
    case "used": return function (c) { return c.usage === "used"; };
    case "needs_attention": return function (c) { return !c.project || !c.description || !c.shotTypes.length || !c.exercise; };
    default: return function () { return true; };
  }
}
function projectStats(projectId, clips) {
  var inProj = clips.filter(function (c) { return c.project === projectId; });
  return {
    count: inProj.length,
    unedited: inProj.filter(function (c) { return c.editing === "unedited"; }).length,
    editing: inProj.filter(function (c) { return c.editing === "editing"; }).length,
    finished: inProj.filter(function (c) { return c.editing === "finished"; }).length,
    noUsage: inProj.filter(function (c) { return c.usage === "no_usage"; }).length,
    selected: inProj.filter(function (c) { return c.usage === "selected"; }).length,
    used: inProj.filter(function (c) { return c.usage === "used"; }).length,
  };
}
function findProject(id) {
  for (var i = 0; i < state.projects.length; i++) if (state.projects[i].id === id) return state.projects[i];
  return null;
}
function findClip(id) {
  for (var i = 0; i < state.clips.length; i++) if (state.clips[i].id === id) return state.clips[i];
  return null;
}
function selectedCount() { return Object.keys(state.selectedIds).filter(function (k) { return state.selectedIds[k]; }).length; }

function shiftMonth(monthStr, delta) {
  var parts = monthStr.split("-");
  var d = new Date(+parts[0], +parts[1] - 1 + delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function eventsByDate(monthStr) {
  var map = {};
  state.calendarEvents.forEach(function (ev) {
    if (!ev.date) return;
    (map[ev.date] = map[ev.date] || []).push(ev);
  });
  return map;
}
function CalendarHtml() {
  var monthStr = state.calendarMonth;
  var parts = monthStr.split("-");
  var year = +parts[0], monthIdx = +parts[1] - 1;
  var monthLabel = new Date(year, monthIdx, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  var firstOfMonth = new Date(year, monthIdx, 1);
  var startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
  var daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
  var gridStart = new Date(year, monthIdx, 1 - startOffset);
  var todayStr = new Date().toISOString().slice(0, 10);
  var byDate = eventsByDate(monthStr);

  var cells = "";
  for (var i = 0; i < 42; i++) {
    var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    var dateStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    var isOutside = d.getMonth() !== monthIdx;

    cells += '<div class="cal-daycell ' + (isOutside ? "is-outside" : "") + ' ' + (dateStr === todayStr ? "is-today" : "") + '">' +

  return (

/* ================================ sync setup modal ================================ */

var WORKER_SNIPPET = "export default {\n" +
  "  async fetch(request, env) {\n" +
  "    const cors = {\n" +
  "      \"Access-Control-Allow-Origin\": \"*\",\n" +
  "      \"Access-Control-Allow-Methods\": \"GET,PUT,OPTIONS\",\n" +
  "      \"Access-Control-Allow-Headers\": \"Content-Type,X-Auth-Key\",\n" +
  "    };\n" +
  "    if (request.method === \"OPTIONS\") return new Response(null, { headers: cors });\n" +
  "\n" +
  "    const url = new URL(request.url);\n" +
  "    if (url.pathname !== \"/data\") {\n" +
  "      return new Response(\"Not found\", { status: 404, headers: cors });\n" +
  "    }\n" +
  "    if (env.AUTH_KEY) {\n" +
  "      const key = request.headers.get(\"X-Auth-Key\");\n" +
  "      if (key !== env.AUTH_KEY) {\n" +
  "        return new Response(\"Unauthorized\", { status: 401, headers: cors });\n" +
  "      }\n" +
  "    }\n" +
  "\n" +
  "    if (request.method === \"GET\") {\n" +
  "      const raw = await env.FILES_KV.get(\"state\");\n" +
  "      return new Response(JSON.stringify({ data: raw ? JSON.parse(raw) : null }), {\n" +
  "        headers: { \"Content-Type\": \"application/json\", ...cors },\n" +
  "      });\n" +
  "    }\n" +
  "\n" +
  "    if (request.method === \"PUT\") {\n" +
  "      const body = await request.text();\n" +
  "      await env.FILES_KV.put(\"state\", body);\n" +
  "      return new Response(JSON.stringify({ ok: true }), {\n" +
  "        headers: { \"Content-Type\": \"application/json\", ...cors },\n" +
  "      });\n" +
  "    }\n" +
  "\n" +
  "    return new Response(\"Method not allowed\", { status: 405, headers: cors });\n" +
  "  },\n" +
  "};";

function SyncModalHtml() {

          :
            '<p>By default this app only saves data in this one browser. Cloudflare KV is a real cloud key-value database, but a static page can\'t write to it directly without exposing your account credentials — so a tiny free "Worker" sits in between. It\'s a one-time, ~5 minute setup:</p>' +
            '<ol>' +
              '<li>Go to <code>dash.cloudflare.com</code> and sign in (or make a free account).</li>' +

  }

  else if (state.view === "dashboard") mainHtml = DashboardHtml();

  else if (state.view === "calendar") mainHtml = CalendarHtml();
  else mainHtml = AllFilesHtml(state.view);

  var overlays = "";
  if (state.showAddModal) overlays += AddModalHtml();
  if (state.showNewProjectModal) overlays += NewProjectModalHtml();
  if (state.selectedClipId && state.detailDraft) overlays += DetailPanelHtml();
  if (state.showPalette) overlays += CommandPaletteHtml();
  if (state.showEventModal && state.eventForm) overlays += EventModalHtml();

      (state.toast ? '<div class="toast">' + esc(state.toast) + '</div>' : "") +
    '</div>'
  );
}

function render() {
  var active = document.activeElement;
  var restoreBind = null, restoreSel = null;
  if (active && active.getAttribute && active.getAttribute("data-bind")) {
    restoreBind = active.getAttribute("data-bind");
    if (typeof active.selectionStart === "number") { try { restoreSel = [active.selectionStart, active.selectionEnd]; } catch (e) {} }
    // Explicitly blur before tearing down the DOM. Rebuilding the tree via
    // innerHTML while the focused element is still mid-dispatch of its own
    // "input" event crashes Chromium ("node to be removed is no longer a
    // child of this node") and is why typing used to die after one
    // character. Focus is restored onto the freshly-rendered field below.
    active.blur();
  }
  var scrollTop = null;
  var mainScrollEl = root.querySelector(".main-scroll");
  if (mainScrollEl) scrollTop = mainScrollEl.scrollTop;

  root.innerHTML = buildAppHtml();

  var newMainScroll = root.querySelector(".main-scroll");
  if (newMainScroll && scrollTop !== null) newMainScroll.scrollTop = scrollTop;

  if (restoreBind) {
    var el = root.querySelector('[data-bind="' + restoreBind + '"]');
    if (el) {
      el.focus();
      if (restoreSel && el.setSelectionRange) { try { el.setSelectionRange(restoreSel[0], restoreSel[1]); } catch (e) {} }
    }
  }
}

/* ================================ actions ================================ */

function handleCreate() {
  var f = state.addForm;
  var filename = f.filename.trim();
  if (!filename) return;
  if (state.addCreatingProject && !f.newProject.trim()) return;
  var duplicate = state.clips.filter(function (c) { return c.filename.trim().toLowerCase() === filename.toLowerCase(); })[0];
  if (duplicate) {
    showToast("That filename already exists in Files.");
    return;
  }
  var projectId = f.project;
  if (state.addCreatingProject && f.newProject.trim()) {
    var newProj = { id: uid("proj"), name: f.newProject.trim(), client: f.client || "—", type: "Other", date: f.date };
    var nextProjects = [newProj].concat(state.projects);
    persistProjects(nextProjects);
    projectId = newProj.id;
  }
  var proj = findProject(projectId);
  var clip = {
    id: uid("clip"), filename: filename, date: f.date, project: projectId || "",
    client: f.client || (proj ? proj.client : ""), location: f.location, exercise: f.exercise,
    description: f.description, shotTypes: f.shotTypes, usage: f.usage, editing: f.editing,
    notes: f.notes, createdAt: Date.now(),
  };
  persistClips([clip].concat(state.clips));
  state.showAddModal = false;
  showToast(clip.filename + " added to your library.");
  render();
}

function commitDetailDraft() {
  if (!state.detailDraft) return;
  var draft = state.detailDraft;
  persistClips(state.clips.map(function (c) { return c.id === draft.id ? draft : c; }));
}

function handleDeleteClip(id) {
  var c = findClip(id);
  if (!c) return;
  if (!confirm("Delete " + c.filename + "? This can't be undone.")) return;
  persistClips(state.clips.filter(function (c2) { return c2.id !== id; }));
  state.selectedClipId = null; state.detailDraft = null;
  showToast("File deleted.");
  render();
}
function handleDuplicateClip(id) {
  var src = findClip(id);
  if (!src) return;
  var copy = Object.assign({}, src, { id: uid("clip"), filename: src.filename.replace(/(\.[A-Za-z0-9]+)?$/, "_copy$1"), createdAt: Date.now() });
  persistClips([copy].concat(state.clips));
  showToast("File duplicated.");
  render();
}
function handleArchiveClip(id) {
  persistClips(state.clips.map(function (c) { return c.id === id ? Object.assign({}, c, { usage: "archived" }) : c; }));
  if (state.detailDraft && state.detailDraft.id === id) state.detailDraft.usage = "archived";
  showToast("File archived.");
  render();
}

function handleBulk(action, value) {
  var ids = state.selectedIds;
  var count = selectedCount();
  if (action === "delete") {
    if (!confirm("Delete " + count + " file(s)? This can't be undone.")) return;
    persistClips(state.clips.filter(function (c) { return !ids[c.id]; }));
    showToast(count + " files deleted.");
  } else if (action === "archive") {
    persistClips(state.clips.map(function (c) { return ids[c.id] ? Object.assign({}, c, { usage: "archived" }) : c; }));
    showToast(count + " files archived.");
  } else {
    var patch = {}; patch[action] = value;
    persistClips(state.clips.map(function (c) { return ids[c.id] ? Object.assign({}, c, patch) : c; }));
    showToast("Updated " + count + " files.");
  }
  state.selectedIds = {};
  render();
}

function handleExport(scopeClips) {
  var rows = scopeClips || state.clips;
  var headers = ["filename", "date", "project", "client", "location", "exercise", "description", "shot_type", "usage_status", "editing_status", "notes"];
  var lines = [headers.join(",")];
  rows.forEach(function (c) {
    var proj = findProject(c.project);
    lines.push([c.filename, c.date, proj ? proj.name : "", c.client, c.location, c.exercise, c.description, c.shotTypes.join(" | "), c.usage, c.editing, c.notes].map(csvEscape).join(","));
  });
  downloadText("files-export.csv", lines.join("\n"));
  showToast("Exported metadata to CSV.");
}

function handleImportFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var text = String(reader.result);
    var rows = parseCsv(text);
    if (!rows.length) { showToast("That CSV didn't contain any rows."); return; }
    var nextProjects = state.projects.slice();
    function findOrCreateProject(name, client) {
      if (!name) return "";
      var p = nextProjects.filter(function (p2) { return p2.name.toLowerCase() === name.toLowerCase(); })[0];
      if (!p) { p = { id: uid("proj"), name: name, client: client || "—", type: "Other", date: new Date().toISOString().slice(0, 10) }; nextProjects.push(p); }
      return p.id;
    }
    var existingNames = {};
    state.clips.forEach(function (c) { existingNames[c.filename.trim().toLowerCase()] = true; });
    var imported = rows.map(function (r) {
      var baseName = (r.filename || "UNTITLED.MP4").trim();
      var filename = baseName || "UNTITLED.MP4";
      var n = 2;
      while (existingNames[filename.toLowerCase()]) {
        var dot = filename.lastIndexOf(".");
        filename = (dot > -1 ? filename.slice(0, dot) : filename) + "_" + n + (dot > -1 ? filename.slice(dot) : "");
        n++;
      }
      existingNames[filename.toLowerCase()] = true;
      return {
        id: uid("clip"), filename: filename, date: r.date || new Date().toISOString().slice(0, 10),
        project: findOrCreateProject(r.project, r.client), client: r.client || "", location: r.location || "",
        exercise: r.exercise || "Other", description: r.description || "",
        shotTypes: r.shot_type ? r.shot_type.split("|").map(function (s) { return s.trim(); }).filter(Boolean) : [],
        usage: USAGE_STATUSES.indexOf(r.usage_status) > -1 ? r.usage_status : "no_usage",
        editing: EDITING_STATUSES.indexOf(r.editing_status) > -1 ? r.editing_status : "unedited",
        notes: r.notes || "", createdAt: Date.now(),
      };
    });
    persistProjects(nextProjects);
    persistClips(imported.concat(state.clips));
    showToast("Imported " + imported.length + " files.");
    render();
  };
  reader.readAsText(file);
}

function handleExportBackup() {
  var payload = {
    app: "CinematicByMo.com Files",
    exportedAt: new Date().toISOString(),
    clips: state.clips,
    projects: state.projects,
    calendarEvents: state.calendarEvents,
  };
  var stamp = new Date().toISOString().slice(0, 10);
  downloadText("files-backup-" + stamp + ".json", JSON.stringify(payload, null, 2), "application/json");
  showToast("Full backup downloaded.");
}

function handleImportBackupFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(String(reader.result));
      var clips = data.clips, projects = data.projects, events = Array.isArray(data.calendarEvents) ? data.calendarEvents : [];
      if (!Array.isArray(clips) || !Array.isArray(projects)) {
        showToast("That file doesn't look like a Files backup.");
        return;
      }
      persistAll(clips, projects, events);
      state.clips = clips; state.projects = projects; state.calendarEvents = events;
      showToast("Backup restored — " + clips.length + " files, " + projects.length + " projects.");
      render();
    } catch (e) {
      showToast("Couldn't read that backup file.");
    }
  };
  reader.readAsText(file);
}

/* ================================ event delegation ================================ */

function handleAction(action, el, e) {
  switch (action) {
    case "navigate":
      if (state.selectedProjectId) commitProjectDraft();
      state.view = el.getAttribute("data-view");
      state.selectedProjectId = null; state.projectDraft = null;
      state.selectMode = false; state.selectedIds = {};
      state.mobileSidebarOpen = false;
      render();
      break;
    case "open-add-modal":
      state.showAddModal = true; state.addForm = defaultAddForm(); state.addCreatingProject = false;
      render();
      setTimeout(function () { var f = document.getElementById("af-filename"); if (f) f.focus(); }, 0);
      break;
    case "close-add-modal":
      state.showAddModal = false; render();
      break;
    case "submit-add-modal":
      handleCreate();
      break;
    case "add-project-select":
      if (el.value === "__new") { state.addCreatingProject = true; } else { state.addForm.project = el.value; }
      render();
      break;
    case "cancel-new-project":
      state.addCreatingProject = false; render();
      break;
    case "toggle-shot": {
      var scope = el.getAttribute("data-scope");
      var shot = el.getAttribute("data-shot");
      var obj = scope === "addForm" ? state.addForm : state.detailDraft;
      var idx = obj.shotTypes.indexOf(shot);
      if (idx > -1) obj.shotTypes.splice(idx, 1); else obj.shotTypes.push(shot);
      if (scope === "detailDraft") commitDetailDraft();
      render();
      break;
    }
    case "open-clip": {
      var id = el.getAttribute("data-id");
      var c = findClip(id);
      if (!c) return;
      state.selectedClipId = id;
      state.detailDraft = Object.assign({}, c, { shotTypes: c.shotTypes.slice() });
      render();
      break;
    }
    case "open-clip-from-palette": {
      var id2 = el.getAttribute("data-id");
      var c2 = findClip(id2);
      if (!c2) return;
      state.selectedClipId = id2;
      state.detailDraft = Object.assign({}, c2, { shotTypes: c2.shotTypes.slice() });
      state.showPalette = false;
      render();
      break;
    }
    case "close-detail":
      commitDetailDraft();
      state.selectedClipId = null; state.detailDraft = null;
      render();
      break;
    case "delete-clip":
      handleDeleteClip(el.getAttribute("data-id"));
      break;
    case "duplicate-clip":
      handleDuplicateClip(el.getAttribute("data-id"));
      break;
    case "archive-clip":
      handleArchiveClip(el.getAttribute("data-id"));
      break;
    case "toggle-select": {
      var cid = el.getAttribute("data-id");
      if (state.selectedIds[cid]) delete state.selectedIds[cid]; else state.selectedIds[cid] = true;
      render();
      break;
    }
    case "toggle-select-mode":
      state.selectMode = !state.selectMode; state.selectedIds = {};
      render();
      break;
    case "select-all-filtered": {
      var view = el.getAttribute("data-view");
      var clips = state.clips.filter(viewPredicate(view));
      var f = state.filters;
      if (f.project) clips = clips.filter(function (c) { return c.project === f.project; });
      if (f.client) clips = clips.filter(function (c) { return c.client === f.client; });
      if (f.exercise) clips = clips.filter(function (c) { return c.exercise === f.exercise; });
      if (f.shotType) clips = clips.filter(function (c) { return c.shotTypes.indexOf(f.shotType) > -1; });
      if (f.usage) clips = clips.filter(function (c) { return c.usage === f.usage; });
      if (f.editing) clips = clips.filter(function (c) { return c.editing === f.editing; });
      if (f.location) clips = clips.filter(function (c) { return (c.location || "").toLowerCase().indexOf(f.location.toLowerCase()) > -1; });
      var ids = {}; clips.forEach(function (c) { ids[c.id] = true; });
      state.selectedIds = ids;
      render();
      break;
    }
    case "clear-selection":
      state.selectedIds = {}; render();
      break;
    case "toggle-filters":
      state.showFiltersPopover = !state.showFiltersPopover; render();
      break;
    case "clear-filters":
      state.filters = { project: "", client: "", exercise: "", shotType: "", usage: "", editing: "", location: "" };
      render();
      break;
    case "export-csv":
      handleExport();
      break;
    case "export-project-csv": {
      var pid = el.getAttribute("data-id");
      handleExport(state.clips.filter(function (c) { return c.project === pid; }));
      break;
    }
    case "trigger-import": {
      var inp = document.getElementById("csvFileInput");
      if (inp) inp.click();
      break;
    }
    case "bulk-archive":
      handleBulk("archive");
      break;
    case "bulk-delete":
      handleBulk("delete");
      break;
    case "open-project": {
      var openId = el.getAttribute("data-id");
      var openProj = findProject(openId);
      if (!openProj) return;
      state.selectedProjectId = openId;
      state.projectDraft = projectDraftFrom(openProj);
      state.projectTab = "clips";
      state.selectMode = false; state.selectedIds = {};
      render();
      break;
    }
    case "back-to-projects":
      commitProjectDraft();
      state.selectedProjectId = null; state.projectDraft = null;
      render();
      break;
    case "project-tab":
      state.projectTab = el.getAttribute("data-tab");
      render();
      break;
    case "open-new-project-modal":
      state.showNewProjectModal = true; state.newProjectForm = defaultNewProjectForm();
      render();
      setTimeout(function () { var f = document.getElementById("np-name"); if (f) f.focus(); }, 0);
      break;
    case "close-new-project-modal":
      state.showNewProjectModal = false; render();
      break;
    case "submit-new-project-modal":
      handleCreateProject();
      break;
    case "delete-project":
      handleDeleteProject(el.getAttribute("data-id"));
      break;
    case "open-palette":
      state.showPalette = true; state.paletteQuery = "";
      render();
      setTimeout(function () { var p = document.getElementById("palette-input"); if (p) p.focus(); }, 0);
      break;
    case "close-palette":
      state.showPalette = false; render();
      break;
    case "toggle-settings":
      state.settingsOpen = !state.settingsOpen; render();
      break;
    case "export-backup":
      handleExportBackup();
      state.settingsOpen = false;
      render();
      break;
    case "trigger-import-backup": {
      var backupInp = document.getElementById("backupFileInput");
      if (backupInp) backupInp.click();
      break;
    }
    case "restore-sample":
      resetToSample();
      state.settingsOpen = false;
      showToast("Restored sample data.");
      render();
      break;
    case "toggle-mobile-sidebar":
      state.mobileSidebarOpen = !state.mobileSidebarOpen; render();
      break;
    case "close-mobile-sidebar":
      state.mobileSidebarOpen = false; render();
      break;
    case "cal-prev-month":
      state.calendarMonth = shiftMonth(state.calendarMonth, -1); render();
      break;
    case "cal-next-month":
      state.calendarMonth = shiftMonth(state.calendarMonth, 1); render();
      break;
    case "cal-today":
      state.calendarMonth = new Date().toISOString().slice(0, 7); render();
      break;
    case "cal-add-event":
      state.eventForm = defaultEventForm(el.getAttribute("data-date"));
      state.editingEventId = null;
      state.showEventModal = true;
      render();
      break;
    case "open-event": {
      var evId = el.getAttribute("data-id");
      var ev = state.calendarEvents.filter(function (x) { return x.id === evId; })[0];
      if (!ev) return;
      state.eventForm = { date: ev.date, type: ev.type, projectId: ev.projectId || "", title: ev.title || "", notes: ev.notes || "" };
      state.editingEventId = evId;
      state.showEventModal = true;
      render();
      break;
    }
    case "close-event-modal":
      state.showEventModal = false; state.eventForm = null; state.editingEventId = null;
      render();
      break;
    case "submit-event-modal":
      handleSaveEvent();
      break;
    case "delete-event":
      handleDeleteEvent(el.getAttribute("data-id"));
      break;
    case "open-sync-modal":
      state.syncWorkerUrl = ""; state.syncAuthKey = ""; state.showSyncModal = true; state.settingsOpen = false;
      render();
      break;
    case "close-sync-modal":
      state.showSyncModal = false; render();
      break;
    case "connect-sync":
      handleConnectSync();
      break;
    case "disconnect-sync":
      handleDisconnectSync();
      break;
  }
}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) {
    // close open popovers when clicking outside
    if (state.showFiltersPopover && !e.target.closest(".filter-popover")) { state.showFiltersPopover = false; render(); }
    if (state.settingsOpen && !e.target.closest(".sidebar-foot")) { state.settingsOpen = false; render(); }
    return;
  }
  var action = el.getAttribute("data-action");
  if (action === "bulk-select") return; // handled by change
  handleAction(action, el, e);
});

document.addEventListener("input", function (e) {
  var el = e.target.closest("[data-bind]");
  if (!el) return;
  setPath(state, el.getAttribute("data-bind"), el.value);
  render();
});

document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.id === "csvFileInput") {
    var file = el.files && el.files[0];
    handleImportFile(file);
    return;
  }
  if (el.id === "backupFileInput") {
    var backupFile = el.files && el.files[0];
    handleImportBackupFile(backupFile);
    return;
  }
  var bindEl = el.closest("[data-bind]");
  if (bindEl) {
    setPath(state, bindEl.getAttribute("data-bind"), bindEl.value);
    if (bindEl.getAttribute("data-bind").indexOf("detailDraft.") === 0) commitDetailDraft();
    if (bindEl.getAttribute("data-bind").indexOf("projectDraft.") === 0) commitProjectDraft();
    render();
    return;
  }
  var actionEl = el.closest('[data-action="bulk-select"]');
  if (actionEl) {
    var field = actionEl.getAttribute("data-field");
    if (actionEl.value) { handleBulk(field, actionEl.value); }
    return;
  }
  var projEl = el.closest('[data-action="add-project-select"]');
  if (projEl) { handleAction("add-project-select", projEl, e); return; }
});

document.addEventListener("keydown", function (e) {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    state.showPalette = true; state.paletteQuery = "";
    render();
    setTimeout(function () { var p = document.getElementById("palette-input"); if (p) p.focus(); }, 0);
  }
  if (e.key === "Escape") {
    if (state.showPalette) { state.showPalette = false; render(); }
    else if (state.showAddModal) { state.showAddModal = false; render(); }
    else if (state.selectedClipId) { commitDetailDraft(); state.selectedClipId = null; state.detailDraft = null; render(); }
    else if (state.settingsOpen) { state.settingsOpen = false; render(); }
  }
});

/* ================================ init ================================ */

render();
loadData();

})();
</script>
</body>
</html>
